<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Characters</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      --bg: #f6f5f2;
      --panel: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --border: #e3e1dc;
      --accent: #3a5ccc;
      --user: #3a5ccc;
      --user-text: #fff;
      --bot: #efede8;
      --code-bg: #f8f7f4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --panel: #1c1c1f;
        --text: #ececee;
        --muted: #9a9aa2;
        --border: #2c2c31;
        --accent: #7d9bff;
        --bot: #26262b;
        --code-bg: #17171a;
      }
    }

    [x-cloak] { display: none !important; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, sans-serif;
    }

    /* Sidebar */
    aside {
      width: 280px;
      flex-shrink: 0;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--panel);
    }

    aside h1 {
      margin: 20px 16px 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    .char {
      display: flex;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-left: 3px solid transparent;
      background: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .char:hover { background: var(--bot); }

    .char[aria-current="true"] {
      border-left-color: var(--accent);
      background: var(--bot);
    }

    .char .emoji {
      font-size: 26px;
      line-height: 1;
    }

    .char b { display: block; }

    .char small {
      color: var(--muted);
      font-size: 13px;
    }

    /* Chat */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    header h2 {
      margin: 0;
      font-size: 16px;
    }

    header button {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    #log {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      padding: 16px;
    }

    .msg {
      max-width: min(720px, 85%);
      padding: 10px 14px;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }

    .msg.user .text { white-space: pre-wrap; }

    .msg .text > :first-child { margin-top: 0; }
    .msg .text > :last-child { margin-bottom: 0; }
    .msg .text :is(p, ul, ol, pre, blockquote) { margin: .5em 0; }
    .msg .text :is(ul, ol) { padding-left: 1.4em; }
    .msg .text code {
      padding: .1em .35em;
      border-radius: 4px;
      background: var(--code-bg);
      font-size: .9em;
    }

    .msg .text pre {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .msg .text pre code.hljs,
    .msg .text pre code {
      display: block;
      padding: 10px 12px;
      background: var(--code-bg);
      white-space: pre;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--bot);
      border-bottom-left-radius: 4px;
    }

    .msg a { color: var(--accent); }

    .tool {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
    }

    /* Composer */
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    textarea {
      flex: 1;
      max-height: 160px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      resize: none;
    }

    form button {
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    form button:disabled {
      opacity: .5;
      cursor: default;
    }

    @media (max-width: 700px) {
      body { flex-direction: column; }

      aside {
        display: flex;
        width: 100%;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      aside h1 { display: none; }

      .char {
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: auto;
        padding: 8px 14px;
        border-left: 0;
        border-bottom: 3px solid transparent;
      }

      .char[aria-current="true"] { border-bottom-color: var(--accent); }

      .char small { display: none; }

      textarea { font-size: 16px; } /* prevents iOS zoom on focus */
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    marked.use({ breaks: true });
    DOMPurify.addHook('afterSanitizeAttributes', (n) => {
      if (n.tagName === 'A') {
        n.target = '_blank';
        n.rel = 'noopener noreferrer';
      }
    });

    function app() {
      return {
        chars: [],
        current: null,
        chat: null,
        input: '',
        busy: false,
        controller: null,

        async init() {
          this.chars = await (await fetch('/api/characters')).json();
        },

        load(id) {
          try {
            const c = JSON.parse(localStorage.getItem('chat:' + id));
            if (c && c.messages) return c;
          } catch {}
          return { sessionId: crypto.randomUUID(), messages: [] };
        },

        save(id = this.current.id, chat = this.chat) {
          try { localStorage.setItem('chat:' + id, JSON.stringify(chat)); } catch {}
        },

        select(c) {
          this.controller?.abort();
          this.current = c;
          this.chat = this.load(c.id);
          this.busy = false;
          this.$nextTick(() => this.$refs.input.focus());
        },

        clear() {
          if (!confirm(`Clear your chat with ${this.current.name}?`)) return;
          this.controller?.abort();
          this.chat = { sessionId: crypto.randomUUID(), messages: [] };
          this.busy = false;
          this.save();
        },

        // Assistant replies are Markdown; sanitized because they can quote fetched web pages.
        show(el, m) {
          if (m.role !== 'assistant') return (el.textContent = this.body(m));
          el.innerHTML = DOMPurify.sanitize(marked.parse(this.body(m)));
          el.querySelectorAll('pre code').forEach((c) => hljs.highlightElement(c));
        },

        body(m) {
          return m.content || (m.role === 'assistant' && !m.tools?.length ? '…' : '');
        },

        toolLabel(t) {
          let a = {};
          try { a = JSON.parse(t.args); } catch {}
          if (t.name === 'web_search') return `🔎 searched: ${a.query ?? ''}`;
          if (t.name === 'fetch_url') return `📄 read: ${a.url ?? ''}`;
          return `🔧 ${t.name}`;
        },

        resize(el) {
          el.style.height = '';
          el.style.height = el.scrollHeight + 'px';
        },

        async send() {
          const text = this.input.trim();
          if (!text || !this.current || this.busy) return;
          this.input = '';
          this.$refs.input.style.height = '';

          // The user may switch character or clear mid-stream, so pin these.
          const forChar = this.current;
          const forChat = this.chat;
          forChat.messages.push(
            { role: 'user', content: text },
            { role: 'assistant', content: '', tools: [] },
          );
          const reply = forChat.messages.at(-1); // reactive proxy, so edits re-render
          this.save();
          this.busy = true;
          this.controller = new AbortController();

          try {
            const res = await fetch('/api/chat', {
              method: 'POST',
              signal: this.controller.signal,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                characterId: forChar.id,
                sessionId: forChat.sessionId,
                messages: forChat.messages.slice(0, -1).map(({ role, content }) => ({ role, content })),
              }),
            });
            if (!res.ok) throw new Error(await res.text());

            const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
            let buf = '';
            for (;;) {
              const { value, done } = await reader.read();
              if (done) break;
              buf += value;
              const lines = buf.split('\n');
              buf = lines.pop();
              for (const line of lines.filter(Boolean)) {
                const e = JSON.parse(line);
                if (e.type === 'text') reply.content += e.delta;
                else if (e.type === 'tool') reply.tools.push({ name: e.name, args: e.args });
                else if (e.type === 'error') throw new Error(e.message);
              }
            }
          } catch (err) {
            if (err.name !== 'AbortError') {
              reply.content += (reply.content ? '\n\n' : '') + '⚠️ ' + err.message;
            }
          } finally {
            if (!reply.content && !reply.tools.length) forChat.messages.splice(-2); // drop the failed turn
            // Skip saving if the chat was cleared meanwhile (stored session changed).
            if (this.load(forChar.id).sessionId === forChat.sessionId) this.save(forChar.id, forChat);
            if (this.chat === forChat) this.busy = false;
          }
        },
      };
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body x-data="app()">
  <aside>
    <h1>Characters</h1>
    <nav>
      <template x-for="c in chars" :key="c.id">
        <button class="char" :aria-current="current?.id === c.id" @click="select(c)">
          <span class="emoji" x-text="c.emoji"></span>
          <span>
            <b x-text="c.name"></b>
            <small x-text="c.blurb"></small>
          </span>
        </button>
      </template>
    </nav>
  </aside>

  <main>
    <header>
      <h2 x-text="current ? `${current.emoji} ${current.name}` : 'Pick a character'">Pick a character</h2>
      <button x-show="current" x-cloak @click="clear()">Clear chat</button>
    </header>

    <div id="log" x-init="new MutationObserver(() => $el.scrollTop = $el.scrollHeight)
                            .observe($el, { childList: true, subtree: true, characterData: true })">
      <template x-if="!current">
        <p class="empty">Pick a character to start talking.</p>
      </template>
      <template x-if="current && !chat.messages.length">
        <p class="empty" x-text="`Say hello to ${current.name}.`"></p>
      </template>
      <template x-for="m in chat?.messages ?? []">
        <div class="msg" :class="m.role">
          <template x-for="t in m.tools ?? []">
            <span class="tool" x-text="toolLabel(t)"></span>
          </template>
          <div class="text" x-effect="show($el, m)"></div>
        </div>
      </template>
    </div>

    <form @submit.prevent="send()">
      <textarea
        x-ref="input"
        x-model="input"
        rows="1"
        placeholder="Message…"
        aria-label="Message"
        :disabled="!current"
        @input="resize($el)"
        @keydown.enter="if (!$event.shiftKey && !$event.isComposing) { $event.preventDefault(); send() }"
      ></textarea>
      <button :disabled="!current || busy">Send</button>
    </form>
  </main>
</body>
</html>

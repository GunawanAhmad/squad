services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8888:8080" # localhost only
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:5432:5432" # localhost only: never 0.0.0.0, published ports bypass the host firewall
    environment:
      POSTGRES_USER: characters
      POSTGRES_PASSWORD: characters
      POSTGRES_DB: characters
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U characters -d characters"]
      interval: 2s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434" # localhost only: never 0.0.0.0, published ports bypass the host firewall
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata: # named volume; `docker compose down -v` deletes it
  ollama: # bge-m3 weights; re-pull after down -v
